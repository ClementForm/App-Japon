<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Japon">
  <title>Voyage Japon</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <header id="topbar">
    <div id="chips" class="chips"></div>
    <button id="btn-locate" class="icon-btn" aria-label="Ma position">◎</button>
    <button id="btn-menu" class="icon-btn" aria-label="Menu">⋯</button>
  </header>

  <div id="offline-pill" hidden>Hors ligne</div>

  <div id="banner" hidden>
    <span id="banner-text"></span>
    <button id="banner-btn" type="button">Annuler</button>
  </div>

  <section id="sheet">
    <button id="sheet-handle" type="button" aria-label="Agrandir ou réduire"></button>
    <div id="sheet-body"></div>
  </section>

  <!-- Ajouter un point -->
  <dialog id="dlg-add">
    <div class="dlg">
      <h2>Ajouter un point</h2>
      <form id="search-form" class="search-row">
        <input id="search-input" type="search" placeholder="Lieu, lien Google Maps ou « lat, lng »" enterkeyhint="search" autocomplete="off">
        <button type="submit" class="icon-btn" aria-label="Rechercher">🔍</button>
      </form>
      <p id="search-status" class="muted"></p>
      <ul id="search-results" class="results"></ul>
      <div class="stack">
        <button type="button" id="add-tap">👆 Toucher la carte</button>
        <button type="button" id="add-gps">📍 Ma position actuelle</button>
      </div>
      <div class="btn-row end">
        <button type="button" data-close>Fermer</button>
      </div>
    </div>
  </dialog>

  <!-- Modifier un point -->
  <dialog id="dlg-point">
    <form id="point-form" class="dlg">
      <figure id="point-photo" class="photo" hidden><img alt=""><figcaption></figcaption></figure>
      <h2 id="point-heading">Point</h2>
      <label>Nom<input name="title" required autocomplete="off"></label>
      <div class="two">
        <label>Heure<input name="time" type="time"></label>
        <label>Jour<select name="dayId"></select></label>
      </div>
      <label>Note<textarea name="note" rows="3"></textarea></label>
      <label class="check"><input type="checkbox" name="hotel"> Hébergement (icône lit)</label>
      <p id="point-coords" class="muted"></p>
      <div class="btn-row" id="point-extra">
        <button type="button" id="point-move">✥ Déplacer</button>
        <a id="point-goto" class="btn" target="_blank" rel="noopener">Y aller ↗</a>
      </div>
      <div class="btn-row">
        <button type="button" id="point-delete" class="danger">Supprimer</button>
        <span class="grow"></span>
        <button type="button" data-close>Annuler</button>
        <button type="submit" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <!-- Modifier un jour -->
  <dialog id="dlg-day">
    <form id="day-form" class="dlg">
      <h2 id="day-heading">Jour</h2>
      <label>Titre<input name="title" placeholder="ex : Kyoto – temples" autocomplete="off"></label>
      <div class="two">
        <label>Date<input name="date" type="date"></label>
        <label>Couleur<input name="color" type="color"></label>
      </div>
      <div class="btn-row">
        <button type="button" id="day-delete" class="danger">Supprimer</button>
        <span class="grow"></span>
        <button type="button" data-close>Annuler</button>
        <button type="submit" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <!-- Menu -->
  <dialog id="dlg-menu">
    <div class="dlg">
      <h2>Menu</h2>
      <label>Nom du voyage<input id="trip-name" autocomplete="off"></label>
      <label>Fond de carte<select id="basemap"></select></label>      <div class="stack">
        <button type="button" id="menu-download">⬇️ Télécharger la carte pour le hors-ligne</button>
        <button type="button" id="menu-export">💾 Exporter une sauvegarde</button>
        <button type="button" id="menu-import">📂 Importer une sauvegarde</button>
        <button type="button" id="menu-clear-tiles" class="danger">Vider le cache des cartes</button>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <p id="storage-info" class="muted"></p>
      <div class="btn-row end">
        <button type="button" data-close>Fermer</button>
      </div>
    </div>
  </dialog>

  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script src="itineraire.js"></script>
  <script src="app.js"></script>
</body>
</html>
