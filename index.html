<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Japon">
  <title>Voyage Japon</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <header id="topbar">
    <button id="btn-back" class="icon-btn round" aria-label="Vue d’ensemble" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <span class="grow"></span>
    <div class="map-btns">
      <button id="btn-menu" class="icon-btn round" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></button>
      <button id="btn-locate" class="icon-btn round" aria-label="Ma position"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></button>
      <button id="btn-hotels" class="icon-btn round" aria-label="Hôtels"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/></svg></button>
    </div>
  </header>

  <div id="offline-pill" hidden>Hors ligne</div>

  <div id="banner" hidden>
    <span id="banner-text"></span>
    <button id="banner-btn" type="button">Annuler</button>
  </div>

  <section id="sheet">
    <button id="sheet-handle" type="button" aria-label="Agrandir ou réduire"></button>
    <nav id="tabs" class="tabs">
      <button type="button" data-tab="overview" data-icon="map" data-size="22">Aperçu</button>
      <button type="button" data-tab="day" data-icon="calendar" data-size="22">Programme</button>
      <button type="button" data-tab="hotels" data-icon="bed" data-size="22">Hôtels</button>
      <button type="button" data-tab="restos" data-icon="utensils" data-size="22">Restos</button>
    </nav>
    <div id="sheet-body"></div>
  </section>

  <button id="fab-add" class="fab" type="button" aria-label="Ajouter une étape"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>

  <!-- Fiche d'un point (lecture) -->
  <dialog id="dlg-view" class="view-dlg">
    <figure id="view-photo" class="hero" hidden><img alt=""><figcaption></figcaption></figure>
    <button type="button" class="icon-btn round close-x" data-close aria-label="Fermer" data-icon="x"></button>
    <div class="dlg">
      <div class="view-meta"><span id="view-badge" class="badge"></span><span id="view-meta"></span></div>
      <h2 id="view-name"></h2>
      <div id="view-note-box"><div class="label">Notes</div><div id="view-note" class="note"></div></div>
      <div class="stack">
        <a id="view-go" class="btn primary" target="_blank" rel="noopener" data-icon="go">Y aller depuis ma position</a>
        <a id="view-from-prev" class="btn route" target="_blank" rel="noopener"><span data-icon="train" data-size="18">Depuis l’étape précédente</span><small></small></a>
      </div>
      <div class="btn-row">
        <button type="button" id="view-prev" aria-label="Étape précédente" data-icon="left" data-size="24"></button>
        <button type="button" id="view-edit" class="grow" data-icon="pencil" data-size="18">Modifier</button>
        <button type="button" id="view-next" aria-label="Étape suivante" data-icon="right" data-size="24"></button>
      </div>
    </div>
  </dialog>

  <!-- Ajouter un point -->
  <dialog id="dlg-add">
    <div class="dlg">
      <h2>Ajouter un point</h2>
      <form id="search-form" class="search-row">
        <input id="search-input" type="search" placeholder="Lieu, lien Google Maps ou « lat, lng »" enterkeyhint="search" autocomplete="off">
        <button type="submit" class="icon-btn" aria-label="Rechercher" data-icon="search"></button>
      </form>
      <p id="search-status" class="muted"></p>
      <ul id="search-results" class="results"></ul>
      <div class="stack">
        <button type="button" id="add-tap" data-icon="tap">Toucher la carte</button>
        <button type="button" id="add-gps" data-icon="pin">Ma position actuelle</button>
      </div>
      <div class="btn-row end">
        <button type="button" data-close>Fermer</button>
      </div>
    </div>
  </dialog>

  <!-- Modifier un point -->
  <dialog id="dlg-point">
    <form id="point-form" class="dlg">
      <figure id="point-photo" class="photo" hidden><img alt=""><figcaption></figcaption></figure>
      <h2 id="point-heading">Point</h2>
      <label>Nom<input name="title" required autocomplete="off"></label>
      <div class="two">
        <label>Heure<input name="time" type="time"></label>
        <label>Jour<select name="dayId"></select></label>
      </div>
      <label>Note<textarea name="note" rows="3"></textarea></label>
      <label class="check"><input type="checkbox" name="hotel"> Hébergement (icône lit)</label>
      <p id="point-coords" class="muted"></p>
      <div class="btn-row" id="point-extra">
        <button type="button" id="point-move" data-icon="move" data-size="18">Déplacer</button>
        <a id="point-goto" class="btn" target="_blank" rel="noopener" data-icon="go" data-size="18">Y aller</a>
      </div>
      <div class="btn-row">
        <button type="button" id="point-delete" class="danger">Supprimer</button>
        <span class="grow"></span>
        <button type="button" data-close>Annuler</button>
        <button type="submit" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <!-- Modifier un jour -->
  <dialog id="dlg-day">
    <form id="day-form" class="dlg">
      <h2 id="day-heading">Jour</h2>
      <label>Titre<input name="title" placeholder="ex : Kyoto – temples" autocomplete="off"></label>
      <div class="two">
        <label>Date<input name="date" type="date"></label>
        <label>Couleur<input name="color" type="color"></label>
      </div>
      <div class="btn-row">
        <button type="button" id="day-delete" class="danger">Supprimer</button>
        <span class="grow"></span>
        <button type="button" data-close>Annuler</button>
        <button type="submit" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <!-- Restaurant -->
  <dialog id="dlg-resto">
    <form id="resto-form" class="dlg">
      <h2 id="resto-heading">Restaurant</h2>
      <label>Nom<input name="title" required autocomplete="off" placeholder="ex : Ichiran Shibuya"></label>
      <div class="two">
        <label>Ville<input name="city" list="resto-cities" autocomplete="off" placeholder="ex : Kyoto"></label>
        <label>Type<select name="kind">
          <option value="noodles">Nouilles</option>
          <option value="sushi">Poisson / sushi</option>
          <option value="meat">Viande / grill</option>
          <option value="sweet">Sucré / café</option>
          <option value="market">Marché</option>
          <option value="food">Cuisine</option>
        </select></label>
      </div>
      <datalist id="resto-cities"></datalist>
      <label>À manger / notes<textarea name="note" rows="3"></textarea></label>
      <label>Lieu<input name="place" autocomplete="off" placeholder="Lien Google Maps, « lat, lng » ou recherche"></label>
      <p class="muted">Sans lien ni coordonnées, le bouton ouvre une recherche Google Maps (pratique pour une chaîne ou « ラーメン »).</p>
      <label>Quand (facultatif)<input name="when" autocomplete="off" placeholder="ex : 9 nov., soir"></label>
      <label class="check"><input type="checkbox" name="noFish"> Sans poisson OK</label>
      <div class="btn-row">
        <button type="button" id="resto-delete" class="danger">Supprimer</button>
        <span class="grow"></span>
        <button type="button" data-close>Annuler</button>
        <button type="submit" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <!-- Menu -->
  <dialog id="dlg-menu">
    <div class="dlg">
      <h2>Menu</h2>
      <label>Nom du voyage<input id="trip-name" autocomplete="off"></label>
      <label>Fond de carte<select id="basemap"></select></label>      <div class="stack">
        <button type="button" id="menu-download" data-icon="download">Télécharger la carte pour le hors-ligne</button>
        <button type="button" id="menu-export" data-icon="share">Exporter une sauvegarde</button>
        <button type="button" id="menu-import" data-icon="folder">Importer une sauvegarde</button>
        <button type="button" id="menu-clear-tiles" class="danger" data-icon="trash">Vider le cache des cartes</button>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <p id="storage-info" class="muted"></p>
      <div class="btn-row end">
        <button type="button" data-close>Fermer</button>
      </div>
    </div>
  </dialog>

  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script src="itineraire.js"></script>
  <script src="app.js"></script>
</body>
</html>
